<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周易占卜 - 數字化經緯</title>
    <style>
        :root {
            --bg-color: #f8f4ed; 
            --ink-color: #2c3e50; 
            --accent-color: #b03a2e; 
            --border-color: #d5c4a1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: "Noto Serif TC", "STSong", "Songti TC", serif;
            margin: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--ink-color);
            padding-bottom: 10px;
            width: 100%;
        }

        h1 { margin: 0; letter-spacing: 8px; font-size: 2rem; }

        .loading-status {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .action-bar { margin: 20px 0; }

        .btn-divine {
            background-color: var(--ink-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-divine:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-divine:hover:not(:disabled) {
            background-color: var(--accent-color);
            transform: scale(1.05);
        }

        .display-area {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .gua-card {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-color);
            padding: 25px;
            width: 45%;
            min-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none; 
            animation: fadeIn 0.8s forwards;
            border-radius: 8px;
        }

        .gua-name {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
        }

        .hexagram-visual {
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            align-items: center;
            margin: 25px 0;
        }

        .yao {
            height: 16px;
            width: 180px;
            position: relative;
            transition: transform 0.3s;
        }

        .yao.yang { background-color: var(--ink-color); }
        .yao.yin {
            display: flex;
            justify-content: space-between;
        }
        .yao.yin::before, .yao.yin::after {
            content: "";
            height: 100%;
            width: 44%;
            background-color: var(--ink-color);
        }

        .yao.moving::after {
            content: "●";
            position: absolute;
            right: -30px;
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        .gua-details { font-size: 1rem; }
        .detail-item { margin-bottom: 18px; }
        .detail-label {
            font-weight: bold;
            color: var(--accent-color);
            display: block;
            margin-bottom: 5px;
            border-left: 3px solid var(--accent-color);
            padding-left: 8px;
        }

        .yao-list { list-style: none; padding: 0; }
        .yao-list li {
            padding: 6px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .yao-list .highlight {
            background-color: rgba(176, 58, 46, 0.08);
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            opacity: 0.7;
            text-align: center;
            padding-bottom: 30px;
        }

        @media (max-width: 768px) {
            .gua-card { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>周易 · 數字占卜</h1>
        <div id="loadingStatus" class="loading-status">正在載入古籍數據...</div>
    </header>

    <div class="action-bar">
        <button id="btnDivine" class="btn-divine" onclick="performDivination()" disabled>揲蓍起卦</button>
    </div>

    <div class="display-area" id="displayArea">
        <div class="gua-card" id="benGuaCard">
            <div class="gua-name" id="benGuaTitle"></div>
            <div class="hexagram-visual" id="benVisual"></div>
            <div class="gua-details" id="benDetails"></div>
        </div>

        <div class="gua-card" id="zhiGuaCard">
            <div class="gua-name" id="zhiGuaTitle"></div>
            <div class="hexagram-visual" id="zhiVisual"></div>
            <div class="gua-details" id="zhiDetails"></div>
        </div>
    </div>

    <footer>
        依據同目錄下 guaData.json 自動解析<br>
        © <span id="year"></span> iching-bagua | 謙謙君子，卑以自牧
    </footer>
</div>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // 1. 二進制映射表 (注意：索引從初爻到上爻)
    const BINARY_TO_NAME = {
        "111111": "乾", "000000": "坤", "010001": "屯", "100010": "蒙", "010111": "需", "111010": "訟", "000010": "師", "010000": "比",
        "110111": "小畜", "111011": "履", "000111": "泰", "111000": "否", "101111": "同人", "111101": "大有", "000100": "謙", "001000": "豫",
        "011001": "隨", "100110": "蠱", "000011": "臨", "110000": "觀", "100101": "噬嗑", "101001": "賁", "100000": "剝", "000001": "復",
        "100111": "無妄", "111001": "大畜", "100001": "頤", "011110": "大過", "010010": "坎", "101101": "離", "001110": "鹹", "011100": "恒",
        "111100": "遯", "001111": "大壯", "000101": "晉", "101000": "明夷", "101011": "家人", "110101": "睽", "001010": "蹇", "010100": "解",
        "110001": "損", "100011": "益", "011111": "夬", "111110": "姤", "000110": "萃", "011000": "升", "010110": "困", "011010": "井",
        "011101": "革", "101110": "鼎", "001001": "震", "100100": "艮", "001011": "漸", "110100": "歸妹", "001101": "豐", "101100": "旅",
        "110110": "巽", "011011": "兌", "010011": "渙", "110010": "節", "110011": "中孚", "001100": "小過", "101010": "既濟", "010101": "未濟"
    };

    let GUA_DATA = null;

    // 2. 非同步載入 JSON 數據
    async function loadData() {
        const statusEl = document.getElementById('loadingStatus');
        const btn = document.getElementById('btnDivine');
        try {
            // 指向同目錄下的 guaData.json
            const response = await fetch('guaData.json');
            if (!response.ok) throw new Error('無法讀取 JSON 文件');
            GUA_DATA = await response.json();
            
            statusEl.innerText = "數據加載完成，請開始起卦";
            statusEl.style.color = "#2ecc71";
            btn.disabled = false;
        } catch (error) {
            console.error(error);
            statusEl.innerText = "錯誤：無法加載 guaData.json。請確保在 Web 服務器環境下運行。";
        }
    }

    // 初始化加載
    loadData();

    // 3. 起卦邏輯
    async function performDivination() {
        if (!GUA_DATA) return;

        const results = [];
        for (let i = 0; i < 6; i++) {
            results.push(rollThreeCoins());
        }

        // 計算本卦二進制 (7, 9 是陽; 6, 8 是陰)
        const benBinary = results.map(r => (r === 7 || r === 9 ? "1" : "0")).join("");
        const benName = BINARY_TO_NAME[benBinary];
        const movingLines = results.map((r, i) => (r === 6 || r === 9 ? i : -1)).filter(i => i !== -1);

        // 渲染本卦
        renderGuaCard("ben", benName, results, false, movingLines);

        // 如果有變爻，計算並渲染之卦
        if (movingLines.length > 0) {
            const zhiBinary = results.map(r => {
                if (r === 6) return "1"; // 老陰變陽
                if (r === 9) return "0"; // 老陽變陰
                return (r === 7 ? "1" : "0");
            }).join("");
            const zhiName = BINARY_TO_NAME[zhiBinary];
            renderGuaCard("zhi", zhiName, results, true, []);
            document.getElementById("zhiGuaCard").style.display = "block";
        } else {
            document.getElementById("zhiGuaCard").style.display = "none";
        }
    }

    function rollThreeCoins() {
        // 隨機生成 6, 7, 8, 9
        let sum = 0;
        for (let i = 0; i < 3; i++) sum += (Math.floor(Math.random() * 2) + 2);
        return sum;
    }

    function renderGuaCard(type, name, results, isZhi, movingLines) {
        const data = GUA_DATA[name];
        if (!data) {
            console.error(`找不到卦名數據: ${name}`);
            return;
        }

        document.getElementById(`${type}GuaTitle`).innerText = isZhi ? `${name} (之卦)` : `${name} (本卦)`;

        // 視覺化爻線
        const visual = document.getElementById(`${type}Visual`);
        visual.innerHTML = '';
        results.forEach((res, i) => {
            const yao = document.createElement('div');
            let isYang = false;
            
            if(!isZhi) {
                isYang = (res === 7 || res === 9);
            } else {
                // 之卦邏輯
                if(res === 6) isYang = true;
                else if(res === 9) isYang = false;
                else isYang = (res === 7);
            }

            yao.className = `yao ${isYang ? 'yang' : 'yin'}`;
            if (!isZhi && (res === 6 || res === 9)) {
                yao.classList.add('moving');
            }
            visual.appendChild(yao);
        });

        // 填充文字數據
        const details = document.getElementById(`${type}Details`);
        details.innerHTML = `
            <div class="detail-item"><span class="detail-label">【卦辭】</span>${data.guaCi}</div>
            <div class="detail-item"><span class="detail-label">【象傳】</span>${data.xiangZhuan}</div>
            <div class="detail-item">
                <span class="detail-label">【爻辭解讀】</span>
                <ul class="yao-list">
                    ${data.yaoCi.map((y, idx) => `
                        <li class="${movingLines.includes(idx) ? 'highlight' : ''}">${y}</li>
                    `).join('')}
                </ul>
            </div>
        `;

        document.getElementById(`${type}GuaCard`).style.display = "block";
    }
</script>

</body>
</html>
